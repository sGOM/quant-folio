name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql+asyncpg://quant:quant@localhost:5432/quant
        run: alembic upgrade head

      - name: Run pytest (with coverage)
        env:
          DATABASE_URL: postgresql+asyncpg://quant:quant@localhost:5432/quant
          REDIS_URL: redis://localhost:6379/0
        run: >
          pytest
          --cov=app --cov=engine --cov=worker
          --cov-report=term-missing
          --cov-report=xml

      - name: Coverage summary (PR 체크 화면에 표시)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### 백엔드 커버리지"
            echo '```'
            python -m coverage report || echo "(커버리지 데이터 없음 — pytest 가 조기 실패했을 수 있음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
