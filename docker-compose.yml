name: quantfolio

# 백엔드 3개 서비스(web/engine/worker)가 공유하는 시크릿 파일 주입.
#  - 비밀은 평문 env/.env 가 아니라 /run/secrets/* (tmpfs) 로 마운트되어
#    docker inspect·이미지 레이어·프로세스 환경에 남지 않는다.
#  - config 의 `<FIELD>_FILE` 로더가 이 파일을 읽어 평문 env 보다 우선 사용한다.
x-backend-secret-env: &backend-secret-env
  SECRET_KEY_FILE: /run/secrets/secret_key
  CREDENTIAL_ENC_KEY_FILE: /run/secrets/credential_enc_key
  KIS_APP_KEY_FILE: /run/secrets/kis_app_key
  KIS_APP_SECRET_FILE: /run/secrets/kis_app_secret
  TOSS_APP_KEY_FILE: /run/secrets/toss_app_key
  TOSS_APP_SECRET_FILE: /run/secrets/toss_app_secret
  KRX_ID_FILE: /run/secrets/krx_id
  KRX_PW_FILE: /run/secrets/krx_pw
  OPENDART_API_KEY_FILE: /run/secrets/opendart_api_key
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
  S3_BACKUP_ACCESS_KEY_ID_FILE: /run/secrets/s3_backup_access_key_id
  S3_BACKUP_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_backup_secret_access_key

x-backend-secrets: &backend-secrets
  - secret_key
  - credential_enc_key
  - kis_app_key
  - kis_app_secret
  - toss_app_key
  - toss_app_secret
  - krx_id
  - krx_pw
  - opendart_api_key
  - telegram_bot_token
  - telegram_chat_id
  - s3_backup_access_key_id
  - s3_backup_secret_access_key

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant}
      POSTGRES_DB: ${POSTGRES_DB:-quant}
    # 127.0.0.1 바인딩: DB 포트는 호스트 로컬에서만 접근 가능(테일넷 노출 차단).
    # 다른 컨테이너는 도커 내부 네트워크(db:5432)로 접근하므로 영향 없다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quant}:${POSTGRES_PASSWORD:-quant}@db:5432/${POSTGRES_DB:-quant}
      REDIS_URL: redis://redis:6379/0
      <<: *backend-secret-env
    secrets: *backend-secrets
    # 외부 접속은 proxy 를 통한다. 호스트 8000 은 로컬 디버깅용으로만 노출.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 24시간 운용: --reload 제거(파일 변경에 의한 의도치 않은 재시작 방지).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # uvicorn 이 무거운 임포트(pandas·pykrx·vectorbt) 후 :8000 을 실제 listen 할 때까지는
    # 준비 전이다. proxy/frontend 가 이 헬스체크(service_healthy)를 기다려 기동 레이스를 막는다.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./backend:/app

  engine:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quant}:${POSTGRES_PASSWORD:-quant}@db:5432/${POSTGRES_DB:-quant}
      REDIS_URL: redis://redis:6379/0
      <<: *backend-secret-env
    secrets: *backend-secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m engine.main
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quant}:${POSTGRES_PASSWORD:-quant}@db:5432/${POSTGRES_DB:-quant}
      REDIS_URL: redis://redis:6379/0
      <<: *backend-secret-env
    secrets: *backend-secrets
    depends_on:
      redis:
        condition: service_healthy
    # -B: beat 스케줄러를 워커 프로세스에 내장(단일 워커 replica 전제 — 여러 개면 중복 스케줄 위험).
    # python -m celery(설치된 celery 콘솔 스크립트 직접 실행 아님)로 실행해야 한다 — 콘솔
    # 스크립트로 실행하면 sys.path[0]이 스크립트 디렉터리(/usr/local/bin)가 되어 WORKDIR(/app)
    # 최상위 패키지(engine 등)를 임포트하지 못한다(ModuleNotFoundError, §9 재점검 중 발견).
    command: python -m celery -A worker.celery_app.celery_app worker --loglevel=info -B
    volumes:
      - ./backend:/app
      # 야간 DB 백업(worker.backup_database, E-2) 산출물 저장 위치. 서버 디스크 손상 시
      # 이 볼륨도 함께 사라지므로 오프사이트 반출은 별도 필요(docs/db-backup.md 참고).
      - db_backups:/backups

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # 빈 값 = 상대경로(같은 출처)로 API/WS 호출 → proxy 를 통해 접속하면
      # 폰이 어떤 주소로 들어와도 동작하고 재빌드가 필요 없다.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      web:
        condition: service_healthy
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # 단일 출처 리버스 프록시(폰/외부 접속의 유일한 진입점).
  # 외부에는 이 포트만 노출하고 web/frontend 는 위처럼 127.0.0.1 로 가린다.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # HTTPS 자체 서명 인증서를 발급할 대상(WireGuard IP). .env 에서 주입.
      WG_HOST: ${WG_HOST:-10.8.0.1}
    ports:
      - "${APP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 내부 CA·인증서 영속화(재시작해도 루트 CA 가 바뀌지 않게 → 폰 재설치 불필요).
      - caddy_data:/data
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started

# 시크릿 파일 소스. secrets/ 디렉터리는 .gitignore 로 커밋 제외된다.
# 사용하지 않는 브로커(예: 토스 미사용)는 빈 파일로 두면 된다.
secrets:
  secret_key:
    file: ./secrets/secret_key.txt
  credential_enc_key:
    file: ./secrets/credential_enc_key.txt
  kis_app_key:
    file: ./secrets/kis_app_key.txt
  kis_app_secret:
    file: ./secrets/kis_app_secret.txt
  toss_app_key:
    file: ./secrets/toss_app_key.txt
  toss_app_secret:
    file: ./secrets/toss_app_secret.txt
  krx_id:
    file: ./secrets/krx_id.txt
  krx_pw:
    file: ./secrets/krx_pw.txt
  opendart_api_key:
    file: ./secrets/opendart_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_chat_id:
    file: ./secrets/telegram_chat_id.txt
  s3_backup_access_key_id:
    file: ./secrets/s3_backup_access_key_id.txt
  s3_backup_secret_access_key:
    file: ./secrets/s3_backup_secret_access_key.txt

volumes:
  pgdata:
  caddy_data:
  db_backups:
